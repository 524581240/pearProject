server:
  port: 8080

spring:
  application:
    name: geo-saas
  datasource:
    url: jdbc:h2:file:./data/geosaas;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

geosaas:
  jwt:
    secret: geo-saas-dev-secret-change-me-in-production-32bytes-min
    expire-hours: 72
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174"
  engine:
    mode: mock # mock | real
  payment:
    mode: mock # mock | wechat | alipay
  scheduler:
    enabled: true
    cron: "0 */5 * * * *" # every 5 minutes for demo

logging:
  level:
    com.geosaas: INFO
